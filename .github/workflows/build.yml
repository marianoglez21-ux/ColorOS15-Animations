
name: Build ColorOS15 Animation Manager

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'yes'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant Gradle permissions
        run: chmod +x ColorOS15_Animation_Manager/gradlew

      - name: Build APK
        working-directory: ColorOS15_Animation_Manager
        run: ./gradlew --no-daemon clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: ColorOS15-Manager-APK
          path: ColorOS15_Animation_Manager/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
